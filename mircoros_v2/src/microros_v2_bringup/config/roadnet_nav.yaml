route_server:
  ros__parameters: 
    # 路径生成
    route_frame: "map"
    path_density: 0.05

    tracker_update_rate: 3.0
    aggregate_blocked_ids: false
    boundary_radius_to_achieve_node: 0.3          #路径（起点 / 终点）的达成半径阈值
    radius_to_achieve_node: 0.35                   #路径中间节点（非起点 / 终点）的达成半径阈值
    # 最近邻搜索
    enable_nn_search: false              #是否启用基于代价地图的广度优先搜索来寻找最近节点（关闭后只使用欧氏距离最近的路点,开启时会考虑路径上的碰撞）
    max_nn_search_iterations: 10000
    num_nearest_nodes: 5                #使用KD树找到的最近邻节点数量

    smooth_corners: false                        #是否启用拐角平滑     
    #smoothing_radius: 0.2
    #smoothing_angle_threshold: 2.96 # 角度平滑阈值

    # 路径修剪
    max_prune_dist_from_edge: 8.0
    min_prune_dist_from_goal: 0.15
    min_prune_dist_from_start: 0.10
    prune_goal: true

    # 重路由服务
    operations: ["ReroutingService", "CollisionMonitor"]
    # operations: ["ReroutingService"]
    ReroutingService:
      plugin: "roadnet::ReroutingService"
    CollisionMonitor:
      plugin: "roadnet::CollisionMonitor"
      costmap_topic: "global_costmap/costmap_raw"  # 禁止修改
      rate: 1.0                    # 检查频率（Hz）
      reroute_on_collision: true   # 检测到碰撞时触发重规划
      max_cost: 253.0              # 最大允许代价
      check_resolution: 2          # 检查分辨率（1=每个格子）
      max_collision_dist: 0.5      # 最大检查距离（米）

    # 边代价函数
    # edge_cost_functions: ["CostmapScorer","DynamicEdgesScorer"]
    edge_cost_functions: ["DynamicEdgesScorer"]
    CostmapScorer:
      plugin: "roadnet::CostmapScorer" # 代价地图评分器
      use_maximum: false           # 使用平均代价而非最大代价
      invalid_on_collision: true  #  允许碰撞边，但计算高成本
      invalid_off_map: false       # 超出代价地图时不标记为无效
      max_cost: 253.0              # 最大有效代价
      check_resolution: 4          # 检查分辨率
      costmap_topic: "global_costmap/costmap_raw"  # 代价地图话题，禁止修改
      weight: 1.0                  # 权重
    DynamicEdgesScorer:
      plugin: "roadnet::DynamicEdgesScorer"

